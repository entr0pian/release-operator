{{- if eq .Values.github.auth "app" }}
# Read access to exactly one Secret: the GitHub App credentials the
# ExternalSecret above writes into this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "release-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "release-operator.resourceName" (dict "suffix" "github-app-reader" "context" $) }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  resourceNames:
  - {{ include "release-operator.resourceName" (dict "suffix" "github-app" "context" $) }}
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "release-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "release-operator.resourceName" (dict "suffix" "github-app-reader" "context" $) }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "release-operator.resourceName" (dict "suffix" "github-app-reader" "context" $) }}
subjects:
- kind: ServiceAccount
  name: {{ include "release-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
