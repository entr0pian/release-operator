{{- if eq .Values.github.auth "app" }}
# The GitHub App's credentials, from Secrets Manager. The JSON secret's
# properties become the keys the operator reads (appId, installationId,
# privateKey).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "release-operator.resourceName" (dict "suffix" "github-app" "context" $) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "release-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.github.app.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ include "release-operator.resourceName" (dict "suffix" "github-app" "context" $) }}
    creationPolicy: Owner
  data:
  {{- range list "appId" "installationId" "privateKey" }}
  - secretKey: {{ . }}
    remoteRef:
      key: {{ $.Values.github.app.secretPath }}
      property: {{ . }}
  {{- end }}
{{- end }}
