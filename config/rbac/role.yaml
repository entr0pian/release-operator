---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - platform.taskapp.io
  resources:
  - components
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - platform.taskapp.io
  resources:
  - releases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - platform.taskapp.io
  resources:
  - releases/finalizers
  verbs:
  - update
- apiGroups:
  - platform.taskapp.io
  resources:
  - releases/status
  verbs:
  - get
  - patch
  - update
